name: Backend Tests & Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Check for security vulnerabilities
      working-directory: ./backend
      run: npm audit --omit=dev --audit-level=moderate

    - name: Lint code
      working-directory: ./backend
      run: npm run lint --if-present

    - name: Start server (health check)
      working-directory: ./backend
      run: |
        timeout 10s npm start &
        sleep 2
        curl -f http://localhost:3001/api/health || true

  # Railway construye su propia imagen a partir del Dockerfile de la raíz, así
  # que aquí no hace falta publicar en ningún registro: lo que importa es que
  # ese Dockerfile siga construyendo. El job anterior intentaba iniciar sesión
  # en Docker Hub con secretos que no existen (y usaba ./backend como contexto,
  # cuando el Dockerfile está en la raíz), así que fallaba siempre.
  build-docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Comprobar que la imagen construye
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
