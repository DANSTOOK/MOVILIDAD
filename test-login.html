<!DOCTYPE html>
<html>
<head>
  <title>Test Login - OXXO Movilidad</title>
  <style>
    body { font-family: Arial; max-width: 500px; margin: 50px auto; padding: 20px; }
    .box { border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
    input { display: block; width: 100%; padding: 10px; margin: 10px 0; }
    button { background: #E2001A; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; }
    .status { padding: 10px; margin: 10px 0; border-radius: 6px; }
    .success { background: #C8E6C9; color: #1F7A4E; }
    .error { background: #FFCDD2; color: #B3261E; }
    .info { background: #BBDEFB; color: #1976D2; }
    pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🔐 Test Login - OXXO Movilidad</h2>

    <div id="status"></div>

    <h3>Conexión al Backend</h3>
    <button onclick="testHealth()">1. Test Health Check</button>

    <h3>Prueba de Login</h3>
    <label>Usuario:</label>
    <input type="text" id="username" value="admin">

    <label>Contraseña:</label>
    <input type="password" id="password" value="admin123">

    <button onclick="testLogin()">2. Test Login</button>

    <h3>Resultado:</h3>
    <pre id="result">Esperando...</pre>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:3001';

    function updateStatus(message, type = 'info') {
      const statusDiv = document.getElementById('status');
      statusDiv.className = 'status ' + type;
      statusDiv.textContent = message;
    }

    function updateResult(data) {
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    }

    async function testHealth() {
      updateStatus('⏳ Probando conexión...', 'info');
      try {
        const response = await fetch(API_BASE_URL + '/api/health');
        if (!response.ok) throw new Error('Status: ' + response.status);

        const data = await response.json();
        updateStatus('✅ Backend responde correctamente', 'success');
        updateResult(data);
      } catch (error) {
        updateStatus('❌ Error: ' + error.message, 'error');
        updateResult({ error: error.message });
      }
    }

    async function testLogin() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username || !password) {
        updateStatus('❌ Completa usuario y contraseña', 'error');
        return;
      }

      updateStatus('⏳ Intentando login...', 'info');
      try {
        const response = await fetch(API_BASE_URL + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Error de autenticación');
        }

        const data = await response.json();
        updateStatus('✅ Login exitoso! Token: ' + data.token.substring(0, 20) + '...', 'success');
        updateResult(data);

        // Guardar token
        localStorage.setItem('oxxoAuthToken', data.token);
        localStorage.setItem('oxxoUserInfo', JSON.stringify(data.user));

      } catch (error) {
        updateStatus('❌ Error: ' + error.message, 'error');
        updateResult({ error: error.message });
      }
    }

    // Test automático al cargar
    window.onload = function() {
      updateStatus('⏳ Iniciando test automático...', 'info');
      testHealth();
    };
  </script>
</body>
</html>
